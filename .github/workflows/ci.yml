name: Validate connector

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: PowerQueryInfluxHomeAssistant-mez
          path: dist/PowerQueryInfluxHomeAssistant.mez
          if-no-files-found: error
